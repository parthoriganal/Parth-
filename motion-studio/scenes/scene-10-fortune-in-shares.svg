<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE EQUITY MACHINE — Episode 01 · Scene 10 "A fortune in shares"
  Motion Studio OS · vector scene source (source of truth)
  Canvas 1920x1080 · scene duration 7.00s (00:53.0 — 01:00.0)
  Timeline is SMIL so the renderer can seek exact timecodes (svg.setCurrentTime).
  Claim discipline: every number below maps to a dated row in 📚 Research Sources.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'DejaVu Sans', Verdana, sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0A0E1A"/>
      <stop offset="55%"  stop-color="#111830"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>

    <radialGradient id="vig" cx="50%" cy="42%" r="78%">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>

    <linearGradient id="disc" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#FFA26B"/>
      <stop offset="45%"  stop-color="#FF6A3D"/>
      <stop offset="100%" stop-color="#D63A15"/>
    </linearGradient>

    <linearGradient id="numGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="55%"  stop-color="#EDF1F8"/>
      <stop offset="100%" stop-color="#B9C4DA"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF6A3D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF6A3D" stop-opacity="0.18"/>
    </linearGradient>

    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 L0 0 0 80" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- mask that wipes the headline number on from left to right -->
    <mask id="wipe" maskUnits="userSpaceOnUse" x="540" y="380" width="760" height="300">
      <rect x="540" y="380" width="0" height="300" fill="#FFFFFF">
        <animate attributeName="width" begin="0.85s" dur="1.15s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" values="0;760"/>
      </rect>
    </mask>

    <!-- glyph outline, used to keep the sheen inside the number -->
    <clipPath id="numClip">
      <text x="580" y="600" font-size="182" font-weight="700" letter-spacing="-7">$909B</text>
    </clipPath>
  </defs>

  <!-- ══ background ══════════════════════════════════════════════════ -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <ellipse cx="1620" cy="250" rx="360" ry="260" fill="#FF6A3D" opacity="0.07" filter="url(#soft)"/>
  <ellipse cx="300" cy="820" rx="380" ry="260" fill="#3C6BFF" opacity="0.08" filter="url(#soft)"/>
  <rect width="1920" height="1080" fill="url(#vig)"/>

  <!-- ══ header ══════════════════════════════════════════════════════ -->
  <g id="header" opacity="0">
    <animate attributeName="opacity" begin="0.25s" dur="0.5s" fill="freeze" values="0;1"/>
    <animateTransform attributeName="transform" type="translate" begin="0.25s" dur="0.6s"
                      fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"
                      values="0 -18;0 0"/>
    <text x="80" y="100" font-size="33" font-weight="700" letter-spacing="7.5" fill="#FFFFFF">THE EQUITY MACHINE</text>
    <rect x="80" y="120" width="11" height="11" fill="#FF6A3D"/>
    <text x="104" y="132" font-size="17" letter-spacing="3.4" fill="#8A93A6">EPISODE 01 · 60-SECOND EXPLAINER</text>
    <text x="1840" y="100" font-size="17" letter-spacing="3" fill="#8A93A6" text-anchor="end">SCENE 10 / 10</text>
    <text x="1840" y="130" font-size="15" letter-spacing="2" fill="#5C6578" text-anchor="end">00:53.0 — 01:00.0</text>
    <line x1="80" y1="170" x2="1840" y2="170" stroke="#FFFFFF" stroke-opacity="0.13"/>
  </g>

  <!-- ══ portrait disc ═══════════════════════════════════════════════ -->
  <g id="portrait" opacity="0">
    <animate attributeName="opacity" begin="0.05s" dur="0.55s" fill="freeze" values="0;1"/>
    <animateTransform attributeName="transform" type="scale" begin="0.05s" dur="0.9s"
                      fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"
                      values="0.86;1" additive="sum"/>
    <circle cx="300" cy="520" r="212" fill="url(#disc)"/>
    <!-- abstract silhouette: head + shoulders, no photographic likeness -->
    <g fill="#12182A" opacity="0.88">
      <circle cx="300" cy="452" r="66"/>
      <path d="M196 726 C196 646 242 604 300 604 C358 604 404 646 404 726 Z"/>
    </g>
    <path d="M252 434 a66 66 0 0 1 88 -20" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round"/>
    <circle cx="300" cy="520" r="212" fill="none" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <circle cx="300" cy="520" r="236" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"
            stroke-width="2" stroke-dasharray="3 14">
      <animateTransform attributeName="transform" type="rotate" from="0 300 520" to="360 300 520"
                        dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="520" r="262" fill="none" stroke="#FF6A3D" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <g id="byline" opacity="0">
    <animate attributeName="opacity" begin="0.75s" dur="0.5s" fill="freeze" values="0;1"/>
    <text x="300" y="800" font-size="27" font-weight="700" letter-spacing="4.5" fill="#FFFFFF" text-anchor="middle">ELON MUSK</text>
    <text x="300" y="832" font-size="19" letter-spacing="1.6" fill="#8A93A6" text-anchor="middle">Blastar, Pretoria · b. 1971</text>
  </g>

  <!-- ══ headline number ══════════════════════════════════════════════ -->
  <g id="headline" mask="url(#wipe)">
    <text x="580" y="600" font-size="182" font-weight="700" letter-spacing="-7" fill="url(#numGrad)">$909B</text>
    <g clip-path="url(#numClip)">
      <rect x="-260" y="400" width="170" height="240" fill="url(#sheen)" transform="skewX(-18)" opacity="0">
        <animate attributeName="x" begin="1.35s" dur="1.0s" fill="freeze" values="-260;1250"/>
        <animate attributeName="opacity" begin="1.35s" dur="1.0s" fill="freeze" values="0;1;0"/>
      </rect>
    </g>
  </g>

  <g id="pill" opacity="0">
    <animate attributeName="opacity" begin="1.7s" dur="0.5s" fill="freeze" values="0;1"/>
    <animateTransform attributeName="transform" type="translate" begin="1.7s" dur="0.6s" fill="freeze"
                      calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" values="0 14;0 0"/>
    <rect x="580" y="646" width="298" height="48" rx="24" fill="#FF6A3D" fill-opacity="0.10" stroke="#FF6A3D" stroke-width="2"/>
    <text x="729" y="679" font-size="23" font-weight="700" letter-spacing="4" fill="#FF8A5B" text-anchor="middle">MOSTLY STOCK</text>
  </g>

  <g id="subline" opacity="0">
    <animate attributeName="opacity" begin="2.0s" dur="0.55s" fill="freeze" values="0;1"/>
    <text x="580" y="762" font-size="24" fill="#C6CEDD">Net worth on paper — mostly equity, not cash.</text>
    <text x="580" y="800" font-size="19" letter-spacing="1.4" fill="#6F7889">FORBES · 29 OCT 2026</text>
  </g>

  <!-- ══ ownership chain ═════════════════════════════════════════════ -->
  <g id="chain">
    <line x1="1232" y1="348" x2="1232" y2="702" stroke="url(#spine)" stroke-width="2"/>

    <g opacity="0">
      <animate attributeName="opacity" begin="2.35s" dur="0.5s" fill="freeze" values="0;1"/>
      <animateTransform attributeName="transform" type="translate" begin="2.35s" dur="0.6s" fill="freeze"
                        calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" values="40 0;0 0"/>
      <circle cx="1232" cy="348" r="7" fill="#FF6A3D"/>
      <rect x="1260" y="300" width="580" height="96" rx="14" fill="#121A2C" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="1290" y="338" font-size="21" font-weight="700" letter-spacing="3" fill="#FF8A5B">1999</text>
      <text x="1290" y="374" font-size="24" fill="#E7ECF5">Zip2 sold to Compaq</text>
      <text x="1830" y="348" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="end">$307M</text>
      <text x="1830" y="376" font-size="16" fill="#6F7889" text-anchor="end">company sale · ~$22M personal</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" begin="2.85s" dur="0.5s" fill="freeze" values="0;1"/>
      <animateTransform attributeName="transform" type="translate" begin="2.85s" dur="0.6s" fill="freeze"
                        calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" values="40 0;0 0"/>
      <circle cx="1232" cy="466" r="7" fill="#FF6A3D"/>
      <rect x="1260" y="418" width="580" height="96" rx="14" fill="#121A2C" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="1290" y="456" font-size="21" font-weight="700" letter-spacing="3" fill="#FF8A5B">2002</text>
      <text x="1290" y="492" font-size="24" fill="#E7ECF5">PayPal</text>
      <path d="M1386 470 l12 12 l-12 12" fill="none" stroke="#FF8A5B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1412" y="492" font-size="24" fill="#E7ECF5">eBay</text>
      <text x="1830" y="466" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="end">~$176M</text>
      <text x="1830" y="494" font-size="16" fill="#6F7889" text-anchor="end">reported proceeds</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" begin="3.35s" dur="0.5s" fill="freeze" values="0;1"/>
      <animateTransform attributeName="transform" type="translate" begin="3.35s" dur="0.6s" fill="freeze"
                        calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" values="40 0;0 0"/>
      <circle cx="1232" cy="584" r="7" fill="#FF6A3D"/>
      <rect x="1260" y="536" width="580" height="96" rx="14" fill="#121A2C" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="1290" y="574" font-size="21" font-weight="700" letter-spacing="3" fill="#FF8A3D">2021</text>
      <text x="1290" y="610" font-size="24" fill="#E7ECF5">Ranked #1 wealthiest</text>
      <text x="1830" y="584" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="end">$188B</text>
      <text x="1830" y="612" font-size="16" fill="#6F7889" text-anchor="end">Forbes · 8 Jan</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" begin="3.85s" dur="0.5s" fill="freeze" values="0;1"/>
      <animateTransform attributeName="transform" type="translate" begin="3.85s" dur="0.6s" fill="freeze"
                        calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" values="40 0;0 0"/>
      <circle cx="1232" cy="702" r="9" fill="#FF6A3D" filter="url(#glow)"/>
      <rect x="1260" y="654" width="580" height="96" rx="14" fill="#1B2338" fill-opacity="0.88" stroke="#FF6A3D" stroke-opacity="0.55"/>
      <text x="1290" y="692" font-size="21" font-weight="700" letter-spacing="3" fill="#FF8A5B">2026</text>
      <text x="1290" y="728" font-size="24" fill="#FFFFFF">Valuation estimate</text>
      <text x="1830" y="702" font-size="31" font-weight="700" fill="#FF8A5B" text-anchor="end">$909B</text>
      <text x="1830" y="730" font-size="16" fill="#8A93A6" text-anchor="end">Forbes · 29 Oct · mostly equity</text>
    </g>
  </g>

  <!-- ══ footer ══════════════════════════════════════════════════════ -->
  <g id="footer" opacity="0">
    <animate attributeName="opacity" begin="4.5s" dur="0.6s" fill="freeze" values="0;1"/>
    <line x1="80" y1="962" x2="1840" y2="962" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <text x="80" y="1000" font-size="15" letter-spacing="1.6" fill="#7A8394">SOURCES · FORBES (29 OCT 2026) · SEC PROXY (2018) · REUTERS (11 JUN 2026) · NASA CRS (DEC 2008) · SPACE.COM (28 SEP 2008)</text>
    <text x="80" y="1030" font-size="15" letter-spacing="1.2" fill="#565F70">Retrieved 30 Oct 2026 · every figure is a dated public estimate · equity ≠ cash</text>
    <text x="1840" y="1030" font-size="15" letter-spacing="2" fill="#565F70" text-anchor="end">THE EQUITY MACHINE — EPISODE 01</text>
  </g>

  <!-- film grain -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
