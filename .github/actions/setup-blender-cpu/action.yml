name: Set up Blender CPU
description: Install verified CPython 3.11 wheels and the shared libraries needed by bpy
inputs:
  lock:
    description: Path to the pipeline's hash-locked build or render requirements
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11.18'
        cache: pip
        cache-dependency-path: |
          blender_pipeline/requirements-build.lock
          blender_pipeline/requirements-render.lock
    - name: Install Blender shared libraries and verify Python wheels
      env:
        LOCK: ${{ inputs.lock }}
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libgl1 libice6 libsm6 libx11-6 libxext6 libxfixes3 libxi6 libxkbcommon0 libxrender1
        python -m pip install --only-binary=:all: --require-hashes -r "$LOCK"
        python -m pip check
        python -c 'import bpy; assert bpy.app.background; print("Blender", bpy.app.version_string)'
