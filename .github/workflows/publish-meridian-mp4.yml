name: Publish verified Meridian MP4

# One-time publication of an existing master, not a new render.
on:
  push:
    branches: ['arena/1a7a4253-parth']
    paths: ['.github/workflows/publish-meridian-mp4.yml']

permissions: {}

jobs:
  publish:
    if: github.repository == 'parthoriganal/Parth-'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_RUN: '44245101395'
      SOURCE_SHA: bc2d4bd7c5f12f84ceac7bbd7796e43d2876d3c2
      SOURCE_ARTIFACT: '14401578320'
      RELEASE_TAG: meridian-m01-v1
      RELEASE_INPUT: release-input
    steps:
      - name: Check the successful render and the selected artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" | jq -e \
            --arg sha "$SOURCE_SHA" --arg branch "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" '
              .status == "completed" and .conclusion == "success" and
              .head_sha == $sha and .head_branch == $branch and .head_repository.full_name == $repo and
              .path == ".github/workflows/render-meridian.yml"'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" | jq -e \
            --argjson run "$SOURCE_RUN" '
              .workflow_run.id == $run and .name == "meridian-production" and .expired == false and
              .digest == "sha256:429201dfd1ff268083959b2211bdfc644fe46ecbc9ae7761093bb23f22200054"'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: meridian-production
          path: ${{ env.RELEASE_INPUT }}
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Verify master profile and MP4 checksum
        run: |
          qa="$RELEASE_INPUT/delivery-qa.json"
          jq -e '.status == "pass" and .preset == "master" and .video == [1920,1080,24] and
                 .decoded_frames == 216 and .seconds == 9 and .subtitles == 5 and
                 (.audio.cue_alignment | length) == 5' "$qa"
          sha=$(jq -er '.video_sha256 | select(test("^[0-9a-f]{64}$"))' "$qa")
          printf '%s  %s\n' "$sha" "$RELEASE_INPUT/meridian.mp4" | sha256sum --check
      - name: Publish only the verified MP4 and check the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/meridian-notes.md" <<EOF
          The finished nine-second Meridian M/01 design reel. Click **meridian.mp4** under Assets for the direct download.

          **1920×1080 · 24 fps · H.264 with stereo AAC and optional English closed captions.** Rendered on CPU with Blender Cycles, Manim and Remotion. The 1152×648 Cycles plates are composited at 1080p.

          [Verified render, source scenes and soundtrack](https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN).
          EOF
          gh release create "$RELEASE_TAG" "$RELEASE_INPUT/meridian.mp4" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --latest=false \
            --title 'Meridian M/01 — 1080p film' --notes-file "$RUNNER_TEMP/meridian-notes.md"
          sha=$(jq -er .video_sha256 "$RELEASE_INPUT/delivery-qa.json")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/meridian.mp4"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" | jq -e --arg sha "sha256:$sha" --arg url "$url" '
            .draft == false and (.assets | any(.name == "meridian.mp4" and .state == "uploaded" and
                                               .size > 0 and .digest == $sha and .browser_download_url == $url))'
          printf '[Download the verified Meridian MP4](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
