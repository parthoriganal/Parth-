name: Render Meridian (CPU production)

on:
  push:
    branches: ['**']
    paths:
      - 'production/**'
      - '!production/**/*.md'
      - '!production/**/*.jpg'
      - '.github/workflows/render-meridian.yml'
  workflow_dispatch:
    inputs:
      preset:
        description: 'Draft or 1080p delivery (CPU-rendered 3D plates)'
        type: choice
        options: [draft, master]
        default: master
      compositor:
        description: 'Remotion (Free License eligible only) or Pillow/FFmpeg'
        type: choice
        options: [remotion, pillow]
        default: remotion

permissions:
  contents: read
  actions: read

concurrency:
  group: meridian-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  WORK: out/meridian
  COMPOSITOR: ${{ inputs.compositor || 'remotion' }}

jobs:
  prepare:
    name: Author and audit the three editable 3D sets
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blender-cpu
        with:
          lock: blender_pipeline/requirements-build.lock
      - name: Regress Lantern Tide and test the editorial clock
        run: |
          python -m unittest discover -s blender_pipeline/tests -v
          python -m unittest discover -s production/tests -v
      - name: Build, reopen and audit the Blender source
        id: build
        env:
          PRESET: ${{ inputs.preset || 'master' }}
        run: |
          python -u -m production build --preset "$PRESET"
          cat "$WORK/bundle/scene-qa.json"
          matrix=$(python -m production matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meridian-source
          path: out/meridian/bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  plates:
    name: Cycles CPU · ${{ matrix.shot }} ${{ matrix.first }}–${{ matrix.last }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blender-cpu
        with:
          lock: blender_pipeline/requirements-render.lock
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: meridian-source
          path: out/meridian/bundle
      - name: Restore this run's checkpoint on an Actions rerun
        if: ${{ github.run_attempt != '1' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: meridian-frames-${{ matrix.id }}
          path: out/meridian/frames/${{ matrix.id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Render and checkpoint shot batch
        id: render
        env:
          BATCH: ${{ matrix.id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          dest="$WORK/frames/$BATCH"
          mkdir -p "$dest"
          python -u -m production render --shard "$BATCH" 2>&1 | tee "$dest/worker-$ATTEMPT.log"
      - if: ${{ !cancelled() && (steps.render.outcome == 'success' || steps.render.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meridian-frames-${{ matrix.id }}
          path: out/meridian/frames/${{ matrix.id }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  optics:
    name: Manim Cairo · animate the optical diagram
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.18'
      - name: Install the Cairo runtime in a separate virtualenv
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev fonts-dejavu-core
          python -m venv .venv
          log=$(mktemp)
          # A --hash on one requirement enables hash mode for that entire pip invocation.
          .venv/bin/python -m pip install --only-binary=:all: --require-hashes -r blender_pipeline/requirements-media.lock
          if ! .venv/bin/python -m pip install -r production/requirements-manim.txt >"$log" 2>&1; then
            cat "$log"
            detail=$(tail -n 10 "$log" | cut -c1-180 | paste -sd '|' -)
            printf '::error title=Manim setup::%s\n' "${detail//%/%25}"
            exit 1
          fi
          cat "$log"
          .venv/bin/python -m pip check
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: meridian-source
          path: out/meridian/bundle
      - name: Render real vector animation on CPU
        run: |
          mkdir -p "$WORK/diagrams"
          .venv/bin/python -m pip freeze > "$WORK/diagrams/runtime.txt"
          .venv/bin/python -u -m production manim
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meridian-optics
          path: out/meridian/diagrams/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  deliver:
    name: Composite graphic titles, score, subtitles and delivery QA
    needs: [plates, optics]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.18'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: env.COMPOSITOR == 'remotion'
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: production/motion/package-lock.json
      - name: Install CPU media wheels
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r blender_pipeline/requirements-media.lock
      - name: Install optional Remotion compositor
        if: env.COMPOSITOR == 'remotion'
        run: |
          npm ci --prefix production/motion --no-audit --no-fund --ignore-scripts
          chrome=$(command -v google-chrome)
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: meridian-source
          path: out/meridian/bundle
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: meridian-optics
          path: out/meridian/diagrams
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: meridian-frames-*
          path: out/meridian/shards
      - name: Verify hand-offs and stage local assets
        run: |
          mkdir -p "$WORK/frames"
          for artifact in "$WORK"/shards/meridian-frames-*; do
            name=${artifact##*/}
            mv "$artifact" "$WORK/frames/${name#meridian-frames-}"
          done
          python -u -m production stage
      - name: Render Remotion typography and transitions in Chromium
        if: env.COMPOSITOR == 'remotion'
        run: NODE_OPTIONS=--max-old-space-size=2048 node production/motion/render.mjs "$WORK"
      - name: Render the open-source composition path
        if: env.COMPOSITOR == 'pillow'
        run: python -u -m production compose
      - name: Sync audio and captions; decode-check the final export
        run: |
          python -u -m production export
          cat "$WORK/delivery/delivery-qa.json"
      - name: Retain export diagnostics if verification fails
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meridian-diagnostics
          path: out/meridian/delivery/*.log
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      - name: Publish film, original soundtrack, subtitles, Manim plate and Blender sources
        id: delivery
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meridian-production
          path: out/meridian/delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true
      - name: Summarize the deliverable
        env:
          URL: ${{ steps.delivery.outputs.artifact-url }}
        run: |
          {
            printf '## Meridian M/01\n\n[Download the finished reel and editable sources](%s)\n\n' "$URL"
            echo '```json'
            cat "$WORK/delivery/delivery-qa.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
