name: Render Meridian M/02 (Weather Atlas)

on:
  push:
    branches: ['**']
    paths:
      - 'meridian_m02/**'
      - '!meridian_m02/**/*.md'
      - '!meridian_m02/evidence/**'
      - '.github/workflows/render-meridian-m02.yml'
  workflow_dispatch:
    inputs:
      preset:
        description: 'Draft or 1080p master (1152×648 native Cycles plates)'
        type: choice
        options: [draft, master]
        default: master
      plate_run:
        description: 'Optional completed M/02 run on this branch; verify and reuse its rendered plates'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: meridian-m02-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  WORK: out/meridian-m02
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '4'

jobs:
  select:
    name: Select a new render or verify a frozen plate run
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      plate_run: ${{ steps.select.outputs.plate_run }}
    steps:
      - name: Admit only a completed same-branch run with all render jobs passed
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.plate_run }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          source_run="$REQUESTED"
          if [[ -z "$source_run" ]]; then
            source_run=$(printf '%s\n' "$MESSAGE" | sed -nE 's/^M02-Plate-Run: ([0-9]+)$/\1/p')
          fi
          if [[ -z "$source_run" ]]; then
            echo 'plate_run=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$source_run" =~ ^[1-9][0-9]{0,17}$ ]] || { echo 'Invalid M/02 source run ID'; exit 1; }
          api="repos/$GITHUB_REPOSITORY/actions/runs/$source_run"
          gh api "$api" | jq -e --arg branch "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and .head_branch == $branch and .head_repository.full_name == $repo
            and .path == ".github/workflows/render-meridian-m02.yml"'
          gh api --paginate "$api/jobs?per_page=100" | jq -es '
            [.[].jobs[]] as $jobs |
            [$jobs[] | select(.name | startswith("Cycles CPU ·"))] as $plates |
            ($plates | length > 0 and all(.conclusion == "success")) and
            any($jobs[]; .conclusion == "success" and (.name | startswith("Compile the storyboard"))) and
            any($jobs[]; .conclusion == "success" and (.name | startswith("Render fault/correction pairs")))'
          echo "plate_run=$source_run" >> "$GITHUB_OUTPUT"

  prepare:
    needs: select
    if: needs.select.outputs.plate_run == ''
    name: Compile the storyboard, inspect candidates and save editable sets
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blender-cpu
        with:
          lock: blender_pipeline/requirements-build.lock
      - name: Test M/02 and regress Lantern Tide and M/01
        run: |
          python -m unittest discover -s meridian_m02/tests -v
          python -m unittest discover -s production/tests -v
          python -m unittest discover -s blender_pipeline/tests -v
      - name: Author, inspect, correct if necessary and reopen
        id: build
        env:
          PRESET: ${{ inputs.preset || (contains(github.event.head_commit.message, '[m02 master]') && 'master') || 'draft' }}
        run: |
          python -u -m meridian_m02 build --preset "$PRESET"
          matrix=$(python -m meridian_m02 matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: m02-source
          path: out/meridian-m02/bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: m02-preflight
          path: out/meridian-m02/proof/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  plates:
    name: Cycles CPU · ${{ matrix.shot }} ${{ matrix.first }}–${{ matrix.last }}
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blender-cpu
        with:
          lock: blender_pipeline/requirements-render.lock
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: m02-source
          path: out/meridian-m02/bundle/
      - name: Restore this run's checkpoint on rerun
        if: ${{ github.run_attempt != '1' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: m02-frames-${{ matrix.id }}
          path: out/meridian-m02/frames/${{ matrix.id }}/
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Render missing or damaged frames only
        id: render
        env:
          BATCH: ${{ matrix.id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          dest="$WORK/frames/$BATCH"
          mkdir -p "$dest"
          python -u -m meridian_m02 render --shard "$BATCH" 2>&1 | tee "$dest/worker-$ATTEMPT.log"
      - if: ${{ !cancelled() && (steps.render.outcome == 'success' || steps.render.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: m02-frames-${{ matrix.id }}
          path: out/meridian-m02/frames/${{ matrix.id }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  rendered-evidence:
    name: Render fault/correction pairs, controlled closeups and reusable-board proof
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blender-cpu
        with:
          lock: blender_pipeline/requirements-build.lock
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: m02-source
          path: out/meridian-m02/bundle/
      - name: Render controlled prop, PBR, lighting and close gait comparisons
        run: python -u -m meridian_m02 details
      - name: Prove bounded lens, underexposure and foot-plane repairs
        run: python -u -m meridian_m02 --root out/m02-faults build --prove-repairs
      - name: Render two looks of a separate five-bay reusable asset
        run: python -u -m meridian_m02 --root out/m02-variant build --board meridian_m02/examples/lichen-crossing.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: m02-rendered-evidence
          path: |
            out/meridian-m02/details/
            out/m02-faults/proof/
            out/m02-faults/bundle/*.json
            out/m02-variant/proof/
            out/m02-variant/bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

  deliver:
    name: Inspect all images and verify the captioned, scored delivery
    needs: [select, plates, rendered-evidence]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.select.outputs.plate_run != '' || (needs.plates.result == 'success' && needs.rendered-evidence.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.18'
      - name: Install the pinned open stack (no Blender/GPU, Node or paid SDK here)
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r meridian_m02/requirements-media.lock
          python -m pip check
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: m02-source
          path: out/meridian-m02/bundle/
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.plate_run || github.run_id }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: m02-frames-*
          path: out/meridian-m02/shards/
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.plate_run || github.run_id }}
      - name: Validate all plates, then edit and encode
        run: |
          mkdir -p "$WORK/frames"
          for artifact in "$WORK"/shards/m02-frames-*; do
            name=${artifact##*/}
            mv "$artifact" "$WORK/frames/${name#m02-frames-}"
          done
          python -u -m meridian_m02 stage
          python -u -m meridian_m02 compose
          python -u -m meridian_m02 export
          cat "$WORK/delivery/delivery-qa.json"
      - name: Smoke-test the self-contained source archive
        run: |
          python -m zipfile -e "$WORK/delivery/weather-atlas-editable.zip" "$WORK/extracted"
          cd "$WORK/extracted/rebuild"
          python -m meridian_m02 plan --preset draft > /tmp/m02-portable-plan.json
          jq -e '.series == "M/02" and .frames == 96' /tmp/m02-portable-plan.json
      - name: Record machine-readable media evidence on the check run
        run: |
          qa=$(jq -c '{status, video, decoded_frames, seconds, native_3d_plate_res, inspected_plates, subtitles, audio, video_sha256}' "$WORK/delivery/delivery-qa.json")
          printf '::notice title=Weather Atlas verified media::%s\n' "${qa//%/%25}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: m02-export-diagnostics
          path: |
            out/meridian-m02/*.log
            out/meridian-m02/delivery/*.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        id: delivery
        with:
          name: weather-atlas-production
          path: out/meridian-m02/delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true
      - name: Link the verified film and editable assets
        env:
          URL: ${{ steps.delivery.outputs.artifact-url }}
          SOURCE_RUN: ${{ needs.select.outputs.plate_run || github.run_id }}
        run: |
          {
            printf '## Meridian M/02 — Weather Atlas\n\n[Download the film, editable Blender set ZIP and QA](%s)\n\n' "$URL"
            printf 'Validated CPU plate source: %s\n\n' "$SOURCE_RUN"
            echo '```json'
            cat "$WORK/delivery/delivery-qa.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
