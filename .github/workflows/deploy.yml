name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify timeline and graphic systems
        run: npm run verify

      # VEILBREAK ships as a static folder (no build step). Its own suites are
      # dependency-free, so they run here; the shader compile test degrades to
      # static checks unless glslangValidator is installed.
      - name: Verify VEILBREAK
        run: |
          node veilbreak/test/timeline.mjs
          node veilbreak/test/project.mjs

      - run: npm run build

      # Gravity Lab is fully static (no build step), so it ships verbatim
      # inside the Pages artifact at /gravity-lab/
      - name: Include Gravity Lab in the Pages artifact
        run: |
          mkdir -p dist/gravity-lab
          cp -r gravity-lab/index.html gravity-lab/README.md dist/gravity-lab/
          cp -r gravity-lab/assets gravity-lab/docs dist/gravity-lab/

      - name: Include VEILBREAK in the Pages artifact
        run: |
          mkdir -p dist/veilbreak
          cp -r veilbreak/index.html veilbreak/README.md dist/veilbreak/
          cp -r veilbreak/assets veilbreak/docs dist/veilbreak/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
