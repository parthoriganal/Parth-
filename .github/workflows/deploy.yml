name: Deploy to GitHub Pages

on:
  push:
    branches: [main, arena/2db57aee-parth]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_BASE_PATH: /Parth-/

      - name: Verify the built site and ORBITAL route
        run: |
          npm run verify
          test -s dist/motion.html
          grep -q '/Parth-/assets/' dist/motion.html

      # Gravity Lab is fully static (no build step), so it ships verbatim
      # inside the Pages artifact at /gravity-lab/
      - name: Include Gravity Lab in the Pages artifact
        run: |
          mkdir -p dist/gravity-lab
          cp -r gravity-lab/index.html gravity-lab/README.md dist/gravity-lab/
          cp -r gravity-lab/assets gravity-lab/docs dist/gravity-lab/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
