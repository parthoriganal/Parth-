name: Text to Video

on:
  push:
    branches: [arena/268af70e-parth]
    paths:
      - '.github/workflows/text-to-video.yml'
      - 'text-to-video/generate.py'
      - 'text-to-video/requirements.txt'
  workflow_dispatch:
    inputs:
      size:
        description: 'Square resolution (256, 384, 512)'
        default: '512'
        required: false

permissions:
  contents: write

concurrency:
  group: text-to-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Install Text2Video-Zero dependencies
        run: python -m pip install -r text-to-video/requirements.txt

      - name: Fetch pinned Text2Video-Zero
        run: |
          git clone https://github.com/Picsart-AI-Research/Text2Video-Zero.git upstream
          git -C upstream checkout fd76734e06aadb1dee83d2b7a368b14bdaa35565

      - name: Generate video from text
        run: |
          python text-to-video/generate.py \
            --upstream upstream \
            --output text-to-video/output \
            --size "${{ github.event.inputs.size || '512' }}"

      - name: Upload generated video and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-to-video
          path: text-to-video/output/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release asset
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "t2v-${GITHUB_RUN_ID}" \
            text-to-video/output/astronaut-moon.mp4 \
            text-to-video/output/generation.json \
            text-to-video/output/contact-sheet.jpg \
            text-to-video/output/prompt.txt \
            --target "$GITHUB_SHA" \
            --title "Text2Video-Zero: astronaut on the Moon" \
            --notes "Generated by Picsart Text2Video-Zero from text only on a CPU GitHub Actions runner. 8 diffusion-generated frames, 512x512, 4 fps. No input image, zoom, pan, or frame interpolation. See generation.json for prompt, model revision, seed, and frame hashes." \
            --latest=false
