name: Publish the verified Weather Atlas master

# One-time promotion of the finished master, never a new render or a license-dependent export.
on:
  push:
    branches: ['arena/1a7a4253-parth']
    paths: ['.github/workflows/publish-weather-atlas.yml']

permissions: {}

defaults:
  run:
    shell: bash

env:
  SOURCE_RUN: '44255533345'
  SOURCE_SHA: 6b4567e55bafe1777dc9935551903b0509c88d3b
  SOURCE_ARTIFACT_ID: '14405802634'
  SOURCE_ARTIFACT_DIGEST: sha256:b709f354b6ef7be96244524df2516b6ccdd8d69e421c4f565abc2abc0942654f
  VIDEO_SHA: d06ea119d64b7d36910243d653ec93391049877c4b17e09f1a30e552c312b7f9
  RELEASE_TAG: meridian-m02-v1
  RELEASE_TARGET: f74374ff51bdf1a32f8cd1e57eaa6528ec8e4c91

jobs:
  publish:
    name: Verify and publish the exact master files
    if: github.repository == 'parthoriganal/Parth-'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check the frozen finalizer and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" | jq -e \
            --arg sha "$SOURCE_SHA" --arg branch "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success" and .head_sha == $sha and
            .head_branch == $branch and .head_repository.full_name == $repo and
            .path == ".github/workflows/render-meridian-m02.yml"'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" | jq -e \
            --argjson run "$SOURCE_RUN" --arg sha "$SOURCE_SHA" --arg hash "$SOURCE_ARTIFACT_DIGEST" '
            .expired == false and .name == "weather-atlas-production" and .digest == $hash and
            .workflow_run.id == $run and .workflow_run.head_sha == $sha'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: weather-atlas-production
          path: release-input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Validate the 1080p master, the editable ZIP and published checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          delivery = Path('release-input')
          qa_file = delivery / 'delivery-qa.json'
          qa = json.loads(qa_file.read_bytes())
          checksums = json.loads((delivery / 'checksums.json').read_bytes())
          expected = os.environ['VIDEO_SHA']
          assert qa['status'] == 'pass' and qa['preset'] == 'master' and qa['series'] == 'M/02'
          assert qa['video'] == [1920, 1080, 24] and qa['decoded_frames'] == qa['inspected_plates'] == 192
          assert qa['seconds'] == 8.0 and qa['native_3d_plate_res'] == [1152, 648]
          assert qa['verified_inputs'] == {'tide': 60, 'canopy': 72, 'summit': 60}
          assert qa['subtitles'] == 3 and qa['audio']['decoded_samples'] == 384000
          assert [c['sample'] for c in qa['audio']['cue_alignment']] == [0, 120000, 264000]
          assert qa['video_sha256'] == checksums['weather-atlas.mp4'] == expected
          assert set(checksums) == {'weather-atlas.mp4', 'weather-atlas-editable.zip', 'contact-sheet.jpg'}
          for filename, digest in checksums.items():
              with (delivery / filename).open('rb') as asset:
                  assert hashlib.file_digest(asset, 'sha256').hexdigest() == digest, filename
          with ZipFile(delivery / 'weather-atlas-editable.zip') as bundle:
              assert bundle.testzip() is None
              assert bundle.read('delivery-qa.json') == qa_file.read_bytes()
              assert set(bundle.namelist()) >= {'weather-atlas-score.wav', 'weather-atlas.srt', 'storyboard.json',
                                               'rebuild/meridian_m02/requirements-media.lock',
                                               'rebuild/meridian_m02/__main__.py'}
              manifest = json.loads(bundle.read('project.json'))
              assert manifest['project_id'] == qa['project_id']
              for shot in ('tide', 'canopy', 'summit'):
                  assert hashlib.sha256(bundle.read(f'blender/{shot}.blend')).hexdigest() == manifest['scene_sha256'][shot]
          PY
      - name: Create the public GitHub release and verify uploaded asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/weather-atlas-notes.md" <<'EOF'
          An eight-second film in three miniature climates: Tide Archive, Glasshouse, and Snow Observatory.

          - **`weather-atlas.mp4`** — 1920×1080, 24 fps, 192 verified frames, stereo score and selectable English captions. Cycles ran on standard CPU runners at 1152×648 native plate resolution; the final edit is scaled to 1080p.
          - **`weather-atlas-editable.zip`** — three editable Blender 5.0.1 scenes, JSON storyboard, rebuild source and locked requirements, fonts and notices, WAV score, SRT captions, and QA.
          - **`contact-sheet.jpg`**, **`delivery-qa.json`**, and **`checksums.json`** — decoded stills, media verification, and SHA-256 hashes.

          [Verification matrix and visual evidence](https://github.com/parthoriganal/Parth-/blob/f74374ff51bdf1a32f8cd1e57eaa6528ec8e4c91/meridian_m02/VERIFICATION.md) · [16 CPU plate batches](https://github.com/parthoriganal/Parth-/actions/runs/44253579420) · [Successful 1080p finalizer](https://github.com/parthoriganal/Parth-/actions/runs/44255533345).
          EOF
          files=(release-input/{weather-atlas.mp4,weather-atlas-editable.zip,contact-sheet.jpg,delivery-qa.json,checksums.json})
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --latest=false \
            --title 'Meridian M/02 — Weather Atlas' --notes-file "$RUNNER_TEMP/weather-atlas-notes.md"
          release="$RUNNER_TEMP/weather-atlas-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release"
          jq -e --arg target "$RELEASE_TARGET" '.draft == false and .prerelease == false and .target_commitish == $target' "$release"
          for asset in "${files[@]}"; do
            digest=$(sha256sum "$asset" | cut -d' ' -f1)
            jq -e --arg name "${asset##*/}" --arg sha "sha256:$digest" \
              'any(.assets[]; .name == $name and .state == "uploaded" and .digest == $sha)' "$release"
          done
          jq -r '.assets[].browser_download_url' "$release"
